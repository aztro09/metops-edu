name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest          # La CI corre en Linux: es tu verificación de mayúsculas, rutas y fines de línea.
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: metops, POSTGRES_PASSWORD: metops_dev, POSTGRES_DB: metops_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metops" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://metops:metops_dev@localhost:5432/metops_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # toma la versión del campo "packageManager" de package.json
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @metops/api exec prisma generate
      - run: pnpm --filter @metops/api exec prisma migrate deploy
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
