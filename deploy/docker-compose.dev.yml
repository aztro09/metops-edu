services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: metops
      POSTGRES_PASSWORD: metops_dev2639
      POSTGRES_DB: metops
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metops -d metops"]
      interval: 30s
      timeout: 60s
      retries: 5
  mailpit:                  # correo falso para probar "recuperar contraseña"
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata: {}
