services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: metops
      POSTGRES_PASSWORD: metops_dev
      POSTGRES_DB: metops
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  mailpit:                  # correo falso para probar "recuperar contraseña"
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata: {}
